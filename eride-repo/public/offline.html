<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5c5f3d" />
    <title>Reconnect to ERIDE</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #33342f;
        background: #fff;
        font-family: ui-rounded, system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 460px;
      }
      .brand {
        color: #5c5f3d;
        font-weight: 800;
        letter-spacing: 0.16em;
        font-size: 15px;
      }
      .icon {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: #f2f1ec;
        color: #5c5f3d;
        margin: 48px 0 24px;
      }
      h1 {
        font-size: clamp(32px, 8vw, 44px);
        line-height: 1.1;
        letter-spacing: -0.04em;
        margin: 0 0 18px;
      }
      p {
        line-height: 1.7;
        color: #69675f;
        font-size: 16px;
        margin: 0 0 28px;
      }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 12px 24px;
        background: #5c5f3d;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover {
        background: #44482c;
      }
      a:focus-visible {
        outline: 3px solid #5c5f3d;
        outline-offset: 5px;
      }
      small {
        display: block;
        margin-top: 22px;
        color: #69675f;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">ERIDE</div>
      <div class="icon" aria-hidden="true">
        <svg
          width="34"
          height="34"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M12 20h.01M5 12a10 10 0 0 1 3-2M12 9a10 10 0 0 1 7 3M2 8a15 15 0 0 1 3-2M9 4.5A15 15 0 0 1 22 8"
          />
        </svg>
      </div>
      <h1>A quick stop.<br />We'll be here.</h1>
      <p>You're offline. Reconnect to sign in, book a ride, or manage your trips.</p>
      <a href="">Try again</a>
      <small>Booking and account changes need an internet connection.</small>
    </main>
  </body>
</html>
